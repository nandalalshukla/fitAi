name: CI

on:
  pull_request:
  push:
    branches: [Main, main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci --coverage
      - name: Bundle check (Metro, Android + iOS)
        run: npx expo export --platform android --platform ios --output-dir dist
        env:
          EXPO_OFFLINE: '1'
